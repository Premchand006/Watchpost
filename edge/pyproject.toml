[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watchpost-edge"
version = "0.2.0"
description = "Watchpost edge service for the Raspberry Pi 5"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "supervision>=0.20,<0.31",
    "supabase>=2.4",
    "psutil>=5.9",
    "ultralytics>=8.4.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
watchpost = "watchpost.__main__:main"

[tool.setuptools]
packages = ["watchpost"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["yolo26n_ncnn_model", "yolo11n_ncnn_model", "spool"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
